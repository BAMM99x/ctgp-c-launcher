name: Check
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker image cache
        uses: actions/cache@v4
        id: toolchain-cache
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('install-libs.sh', '.github/docker/Dockerfile') }}

      - name: Prepare docker image
        run: |
          docker buildx create --name builder --driver docker-container --use
          docker buildx inspect --bootstrap

          docker buildx build . -f .github/docker/Dockerfile \
            --builder builder \
            --cache-from=type=local,src=/tmp/.buildx-cache \
            --cache-to=type=local,dest=/tmp/.buildx-cache \
            -t retrorewind --load

      - name: Compile project
        run: |
          docker run --rm -i -d -v $(pwd)/:/rr -w /rr --name retrorewind-ci retrorewind bash
          docker exec retrorewind-ci make clean
          docker exec retrorewind-ci make
          docker exec retrorewind-ci make release
          docker stop retrorewind-ci

      - name: Upload channel files
        uses: actions/upload-artifact@v4
        with:
          name: ctgp-c-launcher
          path: build/release
